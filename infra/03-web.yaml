AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GitHub Wrapped - web tier. Amplify Hosting for the Vite front end.

  The app is created WITHOUT a repository connection, and the site is published
  by pushing a build artifact to Amplify's manual deployment API -- see
  scripts/deploy-web.py, which CI also calls.

  This is not the usual Amplify setup, and the reason is specific: the repo is
  owned by another personal GitHub account. Connecting Amplify to a repository
  (via the GitHub App or a token with admin:repo_hook) requires repository
  admin, and personal-account repos grant collaborators write access only --
  there is no admin role to hand out. Manual deployment needs no GitHub access
  whatsoever.

  If the repo ever moves to an org, or to an account that can install the
  Amplify GitHub App, supply RepositoryUrl and GithubAccessToken and this
  template will wire up the native git integration instead.

Parameters:
  Stage:
    Type: String
    Default: dev

  RepositoryUrl:
    Type: String
    Default: ''
    Description: >
      Leave EMPTY to connect the repository in the Amplify console (the
      recommended path). Only set this if you are also supplying
      GithubAccessToken. Must be the HTTPS URL, e.g.
      https://github.com/mosspaul/github_wrapped -- the git@ SSH form is
      rejected.

  GithubAccessToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      Only needed if you are connecting the repo through CloudFormation rather
      than the console. Must be a CLASSIC GitHub token (ghp_...) with `repo`
      and `admin:repo_hook`; fine-grained tokens are silently rejected by
      Amplify. Note `repo` grants read AND write to every repository you own,
      which is why the console flow is preferred. Amplify does not store the
      token -- it is used once to establish the connection and webhook.

  BranchName:
    Type: String
    Default: main

Conditions:
  # Only wire the repository from CloudFormation when BOTH halves are present.
  # Amplify rejects a Repository without a token, so a half-filled config would
  # fail the stack rather than quietly doing the right thing.
  ConnectRepoFromCfn: !And
    - !Not [!Equals [!Ref RepositoryUrl, '']]
    - !Not [!Equals [!Ref GithubAccessToken, '']]

Resources:

  AmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: !Sub 'gh-wrapped-${Stage}'
      Platform: WEB
      # No IAMServiceRoleArn on purpose. Amplify's Early Validation hook checks
      # that the role exists and is assumable *before* CloudFormation creates
      # it, so a role declared in this same stack always fails the changeset
      # with an unhelpful AWS::EarlyValidation::PropertyValidation error.
      # A static SPA does not need one; Amplify provisions a service role
      # itself if you later enable a feature that requires it.

      # Both omitted entirely in the console-connection path. AWS::NoValue is
      # what makes that possible -- an empty string would be treated as a real
      # (invalid) value.
      Repository: !If [ConnectRepoFromCfn, !Ref RepositoryUrl, !Ref 'AWS::NoValue']
      AccessToken: !If [ConnectRepoFromCfn, !Ref GithubAccessToken, !Ref 'AWS::NoValue']

      EnvironmentVariables:
        - Name: VITE_API_BASE
          Value:
            Fn::ImportValue: !Sub 'gh-wrapped-${Stage}-api-endpoint'

      CustomRules:
        # Single-page app: serve index.html for any path that is not a real
        # file, otherwise refreshing on a route 404s.
        - Source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff2?|ttf|map|json)$)([^.]+$)/>'
          Target: /index.html
          Status: '200'

      # The console connection flow will pick this up; it does not need to be
      # re-entered there.
      BuildSpec: |
        version: 1
        frontend:
          phases:
            preBuild:
              commands:
                - cd web
                - npm ci
            build:
              commands:
                - npm run build
          artifacts:
            baseDirectory: web/dist
            files:
              - '**/*'
          cache:
            paths:
              - web/node_modules/**/*

  # Always created. A branch does NOT require a repository behind it -- an
  # unconnected branch is exactly what Amplify's manual deployment API targets,
  # which is how scripts/deploy-web.py and CI publish the site.
  AmplifyBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: !Ref BranchName
      # Only meaningful on the token path; a repo-less branch has nothing to
      # auto-build from and ignores this.
      EnableAutoBuild: !If [ConnectRepoFromCfn, true, false]
      Stage: DEVELOPMENT

Outputs:
  AmplifyAppId:
    Description: Use this to find the app in the console.
    Value: !GetAtt AmplifyApp.AppId

  AmplifyConsoleUrl:
    Description: Open this to connect the repository (console path).
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/amplify/apps/${AmplifyApp.AppId}'

  AmplifyUrl:
    Description: >
      The site URL. On the console path this only resolves once you have
      connected the repository and the first build has finished.
    Value: !Sub 'https://${BranchName}.${AmplifyApp.DefaultDomain}'
    Export:
      Name: !Sub 'gh-wrapped-${Stage}-web-url'
