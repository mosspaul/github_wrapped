AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GitHub Wrapped - data tier. Aurora Serverless v2 MySQL reachable ONLY through
  the RDS Data API (HTTPS + IAM), plus the secrets the app needs.

  The Data API is the load-bearing decision here: it lets Lambdas talk to Aurora
  without being attached to the VPC, which means they keep normal internet
  egress to api.github.com and Bedrock with no NAT Gateway (~$32/mo saved).
  If you ever turn EnableHttpEndpoint off, the whole architecture changes.

Parameters:
  Stage:
    Type: String
    Default: dev

  MinAcu:
    Type: Number
    Default: 0.5
    Description: >
      Minimum Aurora Capacity Units. 0.5 keeps the cluster warm (~$45/mo) so
      demos never hit a resume pause. Set to 0 after the hackathon to let it
      scale to zero (~$0 idle, but ~15s on the first query after a pause).

  MaxAcu:
    Type: Number
    Default: 2

  EngineVersion:
    Type: String
    Default: 8.0.mysql_aurora.3.10.3
    Description: >
      Must be 3.07 or newer -- that is the floor for Data API support on Aurora
      MySQL. Note that the available versions differ by region: us-west-1 (our
      target) offers 3.08.0 through 3.13.0 but NOT any 3.07.x, so do not assume
      the documented minimum is deployable. 3.10.3 is the AWS default there,
      which is the best-tested path. List what a region actually offers with:
        aws rds describe-db-engine-versions --engine aurora-mysql \
          --region <region> --query "DBEngineVersions[].EngineVersion" --output table

Conditions:
  # ServerlessV2 scale-to-zero requires an explicit AutoPause setting; only
  # relevant when MinCapacity is 0.
  ScalesToZero: !Equals [!Ref MinAcu, 0]

Resources:

  # --- Network -------------------------------------------------------------
  # Aurora must live in a VPC even though nothing ever opens a socket to it.
  # This is therefore the smallest legal VPC: no internet gateway, no NAT,
  # no ingress rules. It exists to satisfy RDS, not to carry traffic.

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub 'gh-wrapped-${Stage}'

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: gh-wrapped aurora subnets
      SubnetIds:
        - !Ref SubnetA
        - !Ref SubnetB

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # Must be a single-line plain string: EC2 rejects newlines in security
      # group descriptions, and a YAML folded block (>) appends a trailing one.
      GroupDescription: 'No ingress by design - all access is via the RDS Data API'
      VpcId: !Ref Vpc

  # --- Secrets -------------------------------------------------------------

  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'gh-wrapped/${Stage}/db'
      Description: Aurora master credentials, generated by CloudFormation.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"ghwrapped"}'
        GenerateStringKey: password
        PasswordLength: 32
        # Aurora rejects several punctuation characters in master passwords, and
        # the Data API passes this through verbatim. Alphanumeric avoids a class
        # of "works locally, 400s in Lambda" problems.
        ExcludePunctuation: true

  GithubPatSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'gh-wrapped/${Stage}/github-pat'
      Description: >
        GitHub PAT (public_repo scope) used for all API reads. Created empty --
        populate it after deploy with:
          aws secretsmanager put-secret-value \
            --secret-id gh-wrapped/dev/github-pat \
            --secret-string '{"token":"ghp_..."}'
      SecretString: '{"token":"REPLACE_ME"}'

  # --- Cluster -------------------------------------------------------------

  DbCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: aurora-mysql
      EngineVersion: !Ref EngineVersion
      DatabaseName: gh_wrapped
      MasterUsername: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DbSecurityGroup
      # THE line that makes the Data API work. Without it every rds-data call
      # fails with BadRequestException and a message that does not mention it.
      EnableHttpEndpoint: true
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref MinAcu
        MaxCapacity: !Ref MaxAcu
        SecondsUntilAutoPause: !If [ScalesToZero, 300, !Ref 'AWS::NoValue']
      BackupRetentionPeriod: 1
      DeletionProtection: false
      StorageEncrypted: true

  DbInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref DbCluster
      Engine: aurora-mysql
      # Serverless v2 is expressed as this magic instance class plus the
      # scaling config on the cluster above.
      DBInstanceClass: db.serverless
      PubliclyAccessible: false

  # Rewrites DbSecret to include host/port/dbClusterIdentifier. The Data API
  # requires the secret to be attached to the cluster this way; a bare
  # username/password secret is rejected at query time.
  DbSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DbSecret
      TargetId: !Ref DbCluster
      TargetType: AWS::RDS::DBCluster

Outputs:
  DbClusterArn:
    Value: !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:${DbCluster}'
    Export:
      Name: !Sub 'gh-wrapped-${Stage}-db-cluster-arn'

  DbSecretArn:
    Value: !Ref DbSecret
    Export:
      Name: !Sub 'gh-wrapped-${Stage}-db-secret-arn'

  DbName:
    Value: gh_wrapped
    Export:
      Name: !Sub 'gh-wrapped-${Stage}-db-name'

  GithubPatSecretArn:
    Value: !Ref GithubPatSecret
    Export:
      Name: !Sub 'gh-wrapped-${Stage}-github-pat-arn'
